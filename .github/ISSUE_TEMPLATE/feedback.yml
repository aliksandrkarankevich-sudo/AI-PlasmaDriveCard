name: "Отзыв о тестовой версии (замечания и идеи)"
description: Замечания по работе, визуальные несоответствия и идеи по тестовой (beta) версии
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за тестирование **Drive Cards**!
        Опишите, что заметили. Это может быть баг, неудобство, визуальный артефакт или идея.

  - type: input
    id: version
    attributes:
      label: Версия Drive Cards
      description: Например, 0.96.0-beta3 (видна в настройках виджета или в названии файла .plasmoid)
      placeholder: "0.96.0-beta3"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Тип отзыва
      options:
        - Ошибка / краш
        - Визуальный артефакт
        - Неудобное поведение
        - Идея / предложение
        - Вопрос
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что произошло или что хотелось бы улучшить?
      placeholder: "Например: при прозрачности 40% центр фона выглядит темнее, чем ожидается"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения (для ошибок)
      description: Как воспроизвести проблему? Пропустите, если отзыв — идея.
      placeholder: |
        1. Открыть настройки виджета
        2. Уменьшить Edge Width до 10
        3. ...

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      placeholder: Переход должен быть плавным от краёв к центру

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      placeholder: Центр тоже частично прозрачный

  - type: input
    id: plasma_version
    attributes:
      label: Версия KDE Plasma
      placeholder: "6.1.x"

  - type: input
    id: os
    attributes:
      label: ОС / дистрибутив
      placeholder: CachyOS, Arch Linux, ...

  - type: textarea
    id: logs
    attributes:
      label: Журнал (при необходимости)
      description: |
        Если есть ошибки в журнале:
        `journalctl --user -b | grep -Ei 'drivecard|qml' | tail -30`
        Удалите домашние пути, имена пользователя и UUID.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Подтверждение
      options:
        - label: Я указал точную версию Drive Cards.
          required: true
        - label: Персональные данные из журнала удалены.
          required: true
