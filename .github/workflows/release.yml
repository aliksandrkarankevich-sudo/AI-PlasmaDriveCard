name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.95.0-beta2)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install zip support
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Check and build
        run: ./scripts/check.sh
      - name: Get version and release name
        id: meta
        run: |
          VER=$(python3 -c "import json; print(json.load(open('package/metadata.json'))['KPlugin']['Version'])")
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qi 'beta\|alpha\|rc'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify tag matches metadata version
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          VER=${{ steps.meta.outputs.ver }}
          EXPECTED="v${VER}"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "Ошибка: тег $TAG не совпадает с версией в metadata.json ($EXPECTED)" >&2
            exit 1
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Drive Cards ${{ steps.meta.outputs.ver }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.plasmoid
            dist/SHA256SUMS
